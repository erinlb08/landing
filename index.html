<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>My Travel Wishlist</title>

    <!-- CSS principal -->

  </head>

    <div class="banner">

    <div class="cards container">

      <div class="card">
        <img src="images/lille.jpeg" alt="My student city">

        <a href="#" class="btn-pink">Travel to Lille</a>
      </div>

 <div class="card">
        <img src="images/londres.jpg" alt="My dream trip">

        <a href="#" class="btn-pink">Travel to London</a>
      </div>

    </div>

    <!-- Typeform -->
    <div id="go-section" class="container">
      <div data-tf-live="01KKTV7YJN2GPTGMR0S497MQPB"></div>
      <script src="//embed.typeform.com/next/embed.js"></script>
    </div>

</html>
